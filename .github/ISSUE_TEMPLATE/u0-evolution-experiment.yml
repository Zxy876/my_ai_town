name: U0 演化实验记录
description: 在 GitHub 网页中记录 U0@v0、运行证据、局部观察、下一版共同意图和版本效果
title: "[U0 实验] "
body:
  - type: markdown
    attributes:
      value: |
        ## 填写规则

        这是一条人类驱动的 U0 演化实验记录。先记录运行事实，再判断 Gap 和观察效果；不要把小镇自然产生的链式微扰自动标成 U+ 或 U-。

        每次实验至少保留：共同意图原文、存档修订、居民记忆/检索、计划与行动、世界结果，以及截图或决策 Trace。

  - type: input
    id: experiment_id
    attributes:
      label: 实验编号
      description: 使用稳定编号，后续截图、运行记录和存档都引用它。
      placeholder: EXP-001
    validations:
      required: true

  - type: dropdown
    id: experiment_stage
    attributes:
      label: 当前实验阶段
      options:
        - 建立 U0@v0
        - 自然运行并观察
        - 已发现 Gap
        - 已投递局部观察
        - 已提出下一版共同意图
        - 已完成版本前后比较
        - 已归档并完成判定
    validations:
      required: true

  - type: input
    id: town_save
    attributes:
      label: 小镇、存档槽与起始修订
      description: 写明小镇编号、存档槽、Save Revision、World Revision 和开始时的游戏时间。
      placeholder: 小镇1 / 槽1 / Save Revision 12 / World 4520 / 第3天 15:30
    validations:
      required: true

  - type: textarea
    id: baseline_intent
    attributes:
      label: U0@v0 或当前基准版本
      description: 粘贴完整共同意图，不要只写摘要。若当前不是 v0，请同时写明版本号与父版本。
      placeholder: |
        版本：U0@v0
        父版本：无
        完整共同意图：
    validations:
      required: true

  - type: textarea
    id: resident_evidence
    attributes:
      label: 全体居民投递、记忆与检索证据
      description: 先确认共同意图进入全体居民长期记忆，再记录相关居民的排名、检索、计划和行动差异。
      value: |
        - 投递覆盖：
        - 未抵达/待投递居民：
        - 关键居民与记忆节点：
        - 是否检索到共同意图：
        - 检索后计划或行动：
    validations:
      required: true

  - type: textarea
    id: natural_run_gap
    attributes:
      label: 自然运行过程与 Gap 证据
      description: 不预设固定认知步数。说明运行终点、观察到的事实、共同意图未覆盖或执行脆弱之处，并附证据。
      value: |
        - 运行 ID：
        - 运行终点/停止条件：
        - 观察到的行为和世界结果：
        - Gap/脆弱性：
        - 截图、记忆或决策 Trace：
    validations:
      required: true

  - type: textarea
    id: local_observation
    attributes:
      label: 投给单个居民的自然语言观察
      description: 写明目标居民、投递时间和观察原文。尚未投递时填写“尚未投递”，不要预先把文本写成 U+ 或 U- 标签。
      value: |
        - 观察 ID：
        - 目标居民：
        - 投递时间：
        - 观察原文：
    validations:
      required: true

  - type: dropdown
    id: observation_effect
    attributes:
      label: 观察的事后效果分类
      description: 只能根据记忆、计划、行动和世界结果事后判断。
      options:
        - 未判定
        - U+（缩小当前版本的 Gap）
        - U-（扩大当前版本的 Gap）
        - 基本关联（进入认知但无明确方向）
        - 产生新的 Gap
      default: 0
    validations:
      required: true

  - type: textarea
    id: cognitive_outcome
    attributes:
      label: 观察后的记忆、计划、行动与世界结果
      value: |
        - 记忆写入与节点：
        - 是否被检索：
        - 投递前计划：
        - 投递后计划：
        - 实际行动：
        - 世界结果：
        - 是否有角色间传播或影响：
    validations:
      required: true

  - type: textarea
    id: next_intent
    attributes:
      label: 下一版共同意图 U0@v1-vN
      description: 尚未提出时填写“尚未提出”。提出后必须写明父版本、保留内容、改变内容、Gap 依据和完整新意图。
      value: |
        - 新版本：
        - 父版本：
        - 保留内容：
        - 改变内容：
        - Gap 与观察依据：
        - 完整新共同意图：
        - 批准人和批准时间：
        - 全镇投递结果与新存档修订：
    validations:
      required: true

  - type: textarea
    id: version_comparison
    attributes:
      label: 版本前后比较与新 Gap
      description: 说明这是连续版本前后比较还是同一修订平行 A/B；不要把连续运行误写成严格控制变量实验。
      value: |
        - 比较类型：连续版本前后比较 / 同一修订平行 A/B
        - 旧版本行为和世界结果：
        - 新版本行为和世界结果：
        - 已知 Gap 是否缩小及证据：
        - 新暴露的 Gap：
    validations:
      required: true

  - type: textarea
    id: archive_links
    attributes:
      label: 归档与证据链接
      description: 可以直接把图片拖入此处，并粘贴存档、记忆、Trace 或其他 GitHub 链接。
      value: |
        - 存档修订：
        - 意图版本：
        - 局部观察：
        - 记忆/检索：
        - 计划/行动：
        - 决策 Trace 或思考/反思：
        - 世界结果与前后截图：
    validations:
      required: true

  - type: dropdown
    id: final_judgment
    attributes:
      label: 当前人工判定
      options:
        - 实验尚未完成
        - 新版缩小了已知 Gap
        - 新版无明显改善
        - 新版使问题恶化
        - 证据不足，无法判断
      default: 0
    validations:
      required: true

  - type: textarea
    id: next_action
    attributes:
      label: 下一步
      description: 写下一版候选意图、需要补充的证据或继续运行的停止条件。
      placeholder: 下一轮需要验证……
    validations:
      required: true

  - type: checkboxes
    id: evidence_confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我先记录运行事实，再进行 U+/U-/基本关联和 Gap 判定。
          required: true
        - label: 我没有把自然发生的链式微扰自动当成系统生成的 U+ 或 U-。
          required: true
        - label: 我已注明本次比较是连续版本前后比较，还是同一修订平行 A/B。
          required: true
